app = "sp-spices-diary"
primary_region = "bom"

[build]

[http_service]
  internal_port = 8501
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "10s"
    path = "/_stcore/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
